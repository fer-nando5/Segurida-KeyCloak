services:
  postgresql_security:
    image: postgres:latest
    container_name: security_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: Password2025
      POSTGRES_DB: security_db
    volumes:
      - security_db_data:/var/lib/postgresql/data
    ports:
      - 1600:5432
  vault:
    image: hashicorp/vault:1.17
    ports:
      - 8200:8200
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: iXjBBTbHc5zZxW
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    command: server -dev -dev-listen-address=0.0.0.0:8200
    volumes:
        - vault_security:/vault/file
  redis:
    image: redis:7.4-alpine
    container_name: redis_auth
    restart: always
    ports: 
        - "6379:6379"
    volumes:
        - redis_security:/data
    command: ["redis-server", "--appendonly", "yes"]
  cap:
    image: tiago2/cap:latest
    container_name: cap-standalone
    ports:
      - "3000:3000"
    environment:
      ADMIN_KEY: 63f4945d921d599f27ae4fdf5bada3f1
      ENABLE_ASSETS_SERVER: "true"
      WIDGET_VERSION: "latest"
      WASM_VERSION: "latest"
      DATA_PATH: "./.data"
    restart: unless-stopped
    volumes:
      - cap-security:/usr/src/app/.data
  keycloack:
    image: quay.io/keycloak/keycloak:25.0
    container_name: keycloack
    environment:
        - KEYCLOAK_ADMIN=admin
        - KEYCLOAK_ADMIN_PASSWORD=admin
    command:
        - "start-dev"
    ports:
        - "8080:8080"
    networks:
        - galaxy_security
volumes:
  security_db_data: null
  redis_security: null
  vault_security: null
  cap-security: null